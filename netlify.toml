# Netlify configuration for Parth Bisht Portfolio Website
# Zero build step: Static files served directly from public/

[build]
  publish = "public"
  # No build command needed — pure vanilla HTML, CSS, and JS

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
